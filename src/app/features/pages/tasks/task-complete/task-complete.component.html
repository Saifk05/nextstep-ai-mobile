<ion-content class="task-complete-content">
  <main class="page">
    <section class="top-bar">
      <button type="button" class="icon-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <h2>Complete Task</h2>

      <div class="header-spacer"></div>
    </section>

    <section class="hero-card">
      <ion-icon name="camera-outline"></ion-icon>

      <h1>Upload Proof</h1>

      <p>
        Add a clear photo proof to complete this task.
      </p>
    </section>

    <section class="form-card">
      <div class="form-group">
        <label>Proof Photo *</label>

        <input
          #fileInput
          type="file"
          accept="image/*"
          hidden
          (change)="onFileSelected($event)"
        />

        @if (proofPreview) {
          <div class="proof-preview">
            <img [src]="proofPreview" alt="Proof photo" />

            <button
              type="button"
              class="remove-btn"
              (click)="removeProof()"
            >
              Remove
            </button>
          </div>
        } @else {
          <button
            type="button"
            class="upload-box"
            (click)="openFilePicker()"
          >
            <ion-icon name="image-outline"></ion-icon>

            <h3>Choose Photo</h3>

            <p>Upload proof image from your device</p>
          </button>
        }
      </div>

      <div class="form-group">
        <label>Completion Note</label>

        <textarea
          rows="4"
          [(ngModel)]="completionNote"
          placeholder="Add optional note"
        ></textarea>
      </div>
    </section>

    <button
      type="button"
      class="submit-btn"
      [disabled]="isSubmitting"
      (click)="submitCompletion()"
    >
      @if (isSubmitting) {
        <span>Submitting...</span>
      } @else {
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <span>Submit Completion</span>
      }
    </button>
  </main>
</ion-content>
