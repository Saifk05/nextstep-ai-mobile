<ion-content class="auth-content" fullscreen>
  <div class="auth-screen">
    <section class="hero">
      <h1>
        Welcome back to<br />
        NextStep AI
      </h1>

      <p>
        Login and continue your personal growth journey.
      </p>
    </section>

    <section class="form-card">
      <div class="auth-toggle">
        <button class="active" type="button">
          Login
        </button>

        <button type="button" (click)="goToRegister()">
          Sign Up
        </button>
      </div>

      <div class="field-group">
        <label>Email</label>

        <div class="input-box">
          <input
            type="email"
            placeholder="Enter your email"
            autocomplete="off"
            [(ngModel)]="email"
          />
        </div>
      </div>

      <div class="field-group">
        <label>Password</label>

        <div class="input-box">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            autocomplete="off"
            [(ngModel)]="password"
          />

          <button
            class="icon-btn"
            type="button"
            (click)="togglePassword()"
          >
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </button>
        </div>
      </div>

      <div class="options-row">
        <div class="remember">
  <input
    type="checkbox"
    id="rememberMe"
    [(ngModel)]="rememberMe"
  />

  <label for="rememberMe">
    Remember Me
  </label>
</div>

        <a>
          Forgot Password?
        </a>
      </div>

      <!-- <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-text">
          {{ errorMessage }}
        </p>
      </ion-text> -->

      <button
        class="primary-btn"
        type="button"
        (click)="login()"
        [disabled]="loading"
      >
        <ion-spinner
          *ngIf="loading"
          name="crescent"
        ></ion-spinner>

        <span *ngIf="!loading">
          Login
        </span>
      </button>

      <div class="divider">
        <span></span>
        <p>Or login with</p>
        <span></span>
      </div>

      <div class="social-row">
  <button
    type="button"
    (click)="loginWithGoogle()"
    [disabled]="loading"
  >
  <img
    src="assets/icon/google-logo.png"
    alt="Google"
  />

  <span>Continue with Google</span>
    </button>
<!-- 
  <button
    type="button"
    (click)="loginWithFacebook()"
    [disabled]="loading"
  >
    <ion-icon name="logo-facebook"></ion-icon>
    <span>Facebook</span>
  </button> -->
</div>

    </section>
  </div>
</ion-content>
