<div class="popup-backdrop" *ngIf="open" (click)="onClose()">
  <div class="popup-card" (click)="$event.stopPropagation()">
    <div class="popup-icon" [class]="type">
      <ion-icon
        [name]="
          type === 'success'
            ? 'checkmark-circle-outline'
            : type === 'danger'
            ? 'trash-outline'
            : type === 'warning'
            ? 'alert-circle-outline'
            : 'information-circle-outline'
        "
      ></ion-icon>
    </div>

    <h2>{{ title }}</h2>
    <p>{{ message }}</p>

    <div class="popup-actions">
      <button class="cancel-btn" type="button" (click)="onClose()">
        {{ cancelText }}
      </button>

      <button class="confirm-btn" type="button" [class]="type" (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
